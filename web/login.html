<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>book-pro Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f5f7;
        --surface: #ffffff;
        --ink: #000000;
        --ink-2: #1a1a1a;
        --ink-muted: #999999;
        --line: #e5e5e5;
        --dark: #000000;
        --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--ink-2);
        font-family: "Inter", sans-serif;
      }
      .login-card {
        width: 100%;
        max-width: 360px;
        padding: 36px 32px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--card-shadow);
      }
      .brand {
        margin: 0 0 4px;
        font-family: "Playfair Display", serif;
        font-size: 28px;
        font-weight: 600;
      }
      .brand-sub {
        margin: 0 0 28px;
        font-size: 13px;
        color: var(--ink-muted);
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        color: var(--ink-2);
      }
      .field {
        margin-bottom: 16px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        background: #fff;
        color: var(--ink);
      }
      input:focus {
        outline: none;
        border-color: var(--ink);
      }
      button {
        width: 100%;
        padding: 11px 12px;
        margin-top: 8px;
        border: none;
        border-radius: 8px;
        background: var(--dark);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .error {
        margin-top: 14px;
        font-size: 13px;
        color: #b91c1c;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <form class="login-card" id="login-form">
      <h1 class="brand">book-pro</h1>
      <p class="brand-sub">로그인하여 계속하기</p>

      <div class="field">
        <label for="login-username">아이디</label>
        <input id="login-username" name="username" type="text" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label for="login-password">비밀번호</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />
      </div>

      <button id="login-submit-btn" type="submit">로그인</button>
      <p class="error" id="login-error"></p>
    </form>

    <script src="/static/login.js"></script>
  </body>
</html>
